name: Déployer sur GitHub Pages

# Un `git push` sur main suffit : les tests tournent, le site se construit et se
# publie. Jeremy n'a jamais à lancer de build à la main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on laisse finir celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le site n'est pas publié si les règles du jeu sont cassées.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # `enablement: true` active GitHub Pages tout seul si ce n'est pas déjà
      # fait, ce qui évite d'avoir à passer par Settings → Pages à la main.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
